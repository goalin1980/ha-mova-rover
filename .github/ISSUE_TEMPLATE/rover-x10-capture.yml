name: Rover X10 sanitized capture
description: Submit diagnostics produced by Home Assistant or the read-only probe
title: "[X10 capture] "
labels: ["protocol-capture"]
body:
  - type: markdown
    attributes:
      value: |
        Attach only diagnostics generated by this project. Never attach raw cloud responses, passwords, tokens, device IDs, serial numbers, MAC/IP addresses, URLs or pool maps.
  - type: checkboxes
    id: consent
    attributes:
      label: Safety and consent
      options:
        - label: The device owner authorized this test.
          required: true
        - label: I inspected the file and found no account credentials or raw identifiers.
          required: true
        - label: No people or animals were in the pool during movement tests.
          required: true
  - type: dropdown
    id: source
    attributes:
      label: Diagnostics source
      options:
        - Home Assistant integration diagnostics
        - rover-x10-core probe
        - rover-x10-modes probe
        - rover-x10-completion probe
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: MOVAhome app version
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
  - type: textarea
    id: attachment
    attributes:
      label: Sanitized diagnostics and observations
      description: Drag the sanitized JSON file here and describe what the Rover was doing.
    validations:
      required: true
